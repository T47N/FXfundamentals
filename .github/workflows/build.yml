name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            automake build-essential

      - name: Install buildozer and Cython
        run: |
          pip install "pip==23.3.2"
          pip install --upgrade Cython==0.29.33 buildozer virtualenv

      - name: Build APK
        env:
          VIRTUALENV_PIP: "23.3.2"
        run: |
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forex-fundamentals-apk
          path: bin/*.apk
