name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build APK using official Buildozer Docker image
        run: |
          docker run --rm -v "${{ github.workspace }}":/home/user/hostcwd kivy/buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forex-fundamentals-apk
          path: bin/*.apk
